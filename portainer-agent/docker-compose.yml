services:
  portainer-agent:
    image: portainer/agent:2.33.6
    container_name: portainer-agent
    restart: always
    ports:
      - "9090:9001" # Host: 9090 (Livre) | Container: 9001 (Padrão do Agent)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes