services:
  # O seu MinIO local que receberá os dados
  minio-local:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    container_name: minio-local
    command: server /data --console-address ":9001"
    volumes:
      - ./backup_data:/data

  # O agente que espelha os dados do servidor para o notebook
  mirror-task:
    image: minio/mc:latest
    container_name: mirror-task
    depends_on:
      - minio-local
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set servidor_251 http://192.168.21.251:9000 minioadmin minioadmin;
      /usr/bin/mc alias set local http://minio-local:9000 minioadmin minioadmin;
      
      while true; do
        echo '🚀 Iniciando sincronização (Modo Contínuo)...';
        # Removendo a barra final e usando o modo --watch com --active-active
        /usr/bin/mc mirror --watch --overwrite --remove servidor_251 local;
        echo '⚠️ Comando encerrou. Reiniciando em 5 segundos...';
        sleep 5;
      done
      "
    restart: always