minioserver:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    container_name: minioserver
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data